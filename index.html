<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK CURRENT - 游戏主界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
        }

        .game-cover {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        /* 可点击按钮区域容器 */
        .button-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 5%;
        }

        /* 每个按钮的可点击区域 */
        .game-btn {
            flex: 1;
            height: 100%;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            margin: 0 2%;
        }

        .game-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 255, 255, 0);
            transition: all 0.3s ease;
            border-radius: 5px;
        }

        .game-btn:hover::before {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .game-btn:active::before {
            background: rgba(0, 255, 255, 0.4);
            transform: scale(0.95);
        }

        /* 消息提示框 */
        .message-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 40px 60px;
            color: #00ffff;
            font-size: 1.5em;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            display: none;
            z-index: 1000;
            min-width: 300px;
        }

        .message-overlay.show {
            display: block;
            animation: messagePopup 0.5s ease;
        }

        .message-overlay .close-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .message-overlay .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        @keyframes messagePopup {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .message-overlay {
                padding: 30px 40px;
                font-size: 1.2em;
                min-width: 250px;
            }
        }

        /* 添加闪烁效果 */
        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- 游戏封面图片 -->
        <img src="游戏封面.png" alt="DARK CURRENT Game Cover" class="game-cover">

        <!-- 可点击按钮覆盖层 -->
        <div class="button-overlay">
            <div class="game-btn" onclick="startGame()" title="START GAME"></div>
            <div class="game-btn" onclick="loadGame()" title="LOAD GAME"></div>
            <div class="game-btn" onclick="showSettings()" title="SETTINGS"></div>
            <div class="game-btn" onclick="quitGame()" title="QUIT"></div>
        </div>
    </div>

    <!-- 消息提示框 -->
    <div class="message-overlay" id="messageBox">
        <div id="messageText"></div>
        <button class="close-btn" onclick="closeMessage()">确定</button>
    </div>

    <script>
        function showMessage(text) {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.textContent = text;
            messageBox.classList.add('show');
        }

        function closeMessage() {
            const messageBox = document.getElementById('messageBox');
            messageBox.classList.remove('show');
        }

        function startGame() {
            showMessage('🎮 START GAME\n\n游戏正在启动中...\n准备进入 DARK CURRENT 的世界！');
            console.log('START GAME clicked');
        }

        function loadGame() {
            showMessage('💾 LOAD GAME\n\n正在加载已保存的游戏进度...');
            console.log('LOAD GAME clicked');
        }

        function showSettings() {
            showMessage('⚙️ SETTINGS\n\n设置菜单\n音量、画质、控制等选项');
            console.log('SETTINGS clicked');
        }

        function quitGame() {
            if (confirm('确定要退出 DARK CURRENT 吗？')) {
                showMessage('👋 QUIT\n\n感谢游玩！\n期待您的再次光临！');
                console.log('QUIT clicked');
            }
        }

        // 键盘快捷键支持
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                startGame();
            } else if (event.key === 'Escape') {
                quitGame();
            } else if (event.key === 's' || event.key === 'S') {
                showSettings();
            } else if (event.key === 'l' || event.key === 'L') {
                loadGame();
            }
        });

        // 点击消息框外部关闭
        document.getElementById('messageBox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMessage();
            }
        });
    </script>
</body>
</html>
