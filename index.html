<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK CURRENT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 全屏游戏封面背景 */
        .game-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('游戏封面.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 按钮区域容器 - 位于屏幕底部 */
        .button-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2%;
            padding: 0 8%;
        }

        /* 每个按钮的可点击区域 */
        .game-button {
            flex: 1;
            height: 60%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        /* 按钮悬停效果 */
        .game-button:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            transform: translateY(-3px);
        }

        .game-button:active {
            background: rgba(0, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* 消息弹窗 */
        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 15, 30, 0.98);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 50px 70px;
            color: #00ffff;
            font-size: 1.8em;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.8),
                        inset 0 0 30px rgba(0, 255, 255, 0.1);
            display: none;
            z-index: 2000;
            min-width: 400px;
            font-family: 'Arial', sans-serif;
            white-space: pre-line;
        }

        .message-popup.show {
            display: block;
            animation: popupAppear 0.4s ease;
        }

        .message-popup .close-button {
            margin-top: 30px;
            padding: 12px 40px;
            background: linear-gradient(135deg, #00ffff 0%, #0099ff 100%);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: bold;
            font-size: 0.6em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .message-popup .close-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 1);
        }

        @keyframes popupAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .button-container {
                height: 12%;
                padding: 0 5%;
            }

            .message-popup {
                padding: 35px 45px;
                font-size: 1.3em;
                min-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 全屏游戏封面 -->
    <div class="game-screen">
        <!-- 透明按钮覆盖层 -->
        <div class="button-container">
            <div class="game-button" onclick="startGame()" title="START GAME"></div>
            <div class="game-button" onclick="loadGame()" title="LOAD GAME"></div>
            <div class="game-button" onclick="showSettings()" title="SETTINGS"></div>
            <div class="game-button" onclick="quitGame()" title="QUIT"></div>
        </div>
    </div>

    <!-- 消息弹窗 -->
    <div class="message-popup" id="messageBox">
        <div id="messageText"></div>
        <button class="close-button" onclick="closeMessage()">OK</button>
    </div>

    <script>
        function showMessage(text) {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.textContent = text;
            messageBox.classList.add('show');
        }

        function closeMessage() {
            const messageBox = document.getElementById('messageBox');
            messageBox.classList.remove('show');
        }

        function startGame() {
            showMessage('START GAME\n\n游戏启动中...\n欢迎来到 DARK CURRENT 的世界');
            console.log('START GAME clicked');
        }

        function loadGame() {
            showMessage('LOAD GAME\n\n加载存档中...');
            console.log('LOAD GAME clicked');
        }

        function showSettings() {
            showMessage('SETTINGS\n\n设置面板\n音量 | 画质 | 控制');
            console.log('SETTINGS clicked');
        }

        function quitGame() {
            if (confirm('确定要退出游戏吗？')) {
                showMessage('QUIT\n\n感谢游玩！');
                console.log('QUIT clicked');
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                startGame();
            } else if (event.key === 'Escape') {
                closeMessage();
            } else if (event.key === 's' || event.key === 'S') {
                showSettings();
            } else if (event.key === 'l' || event.key === 'L') {
                loadGame();
            }
        });

        // 点击弹窗外部关闭
        document.getElementById('messageBox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMessage();
            }
        });
    </script>
</body>
</html>
