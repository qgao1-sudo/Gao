<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏主界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .game-cover {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .game-cover:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .menu-button:active {
            transform: translateY(-1px);
        }

        .menu-button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .menu-button.secondary:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        .menu-button.tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .menu-button.tertiary:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.1);
            color: #333;
            font-size: 1.1em;
            display: none;
        }

        .message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .menu-button {
                font-size: 1em;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>游戏主界面</h1>

        <!-- 游戏封面图片 -->
        <img src="游戏封面.png"
             alt="游戏封面"
             class="game-cover"
             onerror="this.src='Friends taking selfie.png'">

        <!-- 菜单选项 -->
        <div class="menu-options">
            <button class="menu-button" onclick="startGame()">
                🎮 开始游戏
            </button>

            <button class="menu-button secondary" onclick="showSettings()">
                ⚙️ 游戏设置
            </button>

            <button class="menu-button tertiary" onclick="showAbout()">
                ℹ️ 关于游戏
            </button>

            <button class="menu-button" onclick="viewRecords()">
                🏆 游戏记录
            </button>

            <button class="menu-button secondary" onclick="exitGame()">
                🚪 退出游戏
            </button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        function showMessage(text) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.classList.add('show');
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 3000);
        }

        function startGame() {
            showMessage('🎮 正在启动游戏...');
            // 在这里添加开始游戏的逻辑
            console.log('开始游戏');
        }

        function showSettings() {
            showMessage('⚙️ 打开设置界面...');
            // 在这里添加设置界面的逻辑
            console.log('显示设置');
        }

        function showAbout() {
            showMessage('ℹ️ 这是一个精彩的游戏！');
            // 在这里添加关于页面的逻辑
            console.log('关于游戏');
        }

        function viewRecords() {
            showMessage('🏆 查看游戏记录...');
            // 在这里添加记录查看的逻辑
            console.log('查看记录');
        }

        function exitGame() {
            if (confirm('确定要退出游戏吗？')) {
                showMessage('👋 感谢游玩，再见！');
                // 在这里添加退出逻辑
                console.log('退出游戏');
            }
        }

        // 添加键盘支持
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                startGame();
            } else if (event.key === 'Escape') {
                exitGame();
            }
        });
    </script>
</body>
</html>
